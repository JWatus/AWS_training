aws.region=${AWS_REGION:eu-central-1}

aws.rds.hostname=${DB_HOST}
aws.rds.port=${DB_PORT:5432}
aws.rds.database=${DB_NAME}
aws.rds.username=${DB_USERNAME}
aws.rds.ssl-root-cert=${DB_SSL_CERT:/app/certs/global-bundle.pem}

spring.datasource.url=jdbc:postgresql://${aws.rds.hostname}:${aws.rds.port}/${aws.rds.database}
spring.datasource.password=